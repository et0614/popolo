name: Build and publish to NuGet

on:
  # タグを push すると公開が走る。バージョンは csproj の Version で決まり、
  # タグ名はトリガー兼ラベル。--skip-duplicate により新バージョンのパッケージのみ公開される。
  #   全体リリース: v3.1.11 / 個別リリース: core-v3.1.12, io-v3.1.3, webpro-v3.1.2
  push:
    tags:
      - 'v*'
      - 'core-v*'
      - 'io-v*'
      - 'webpro-v*'
  # 手動実行も可能にしておく
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    # Trusted Publishing (OIDC) に必須。id-token: write が無いと NuGet/login が失敗する
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: |
          dotnet test tests/Popolo.Core.Tests/Popolo.Core.Tests.csproj -c Release
          dotnet test tests/Popolo.IO.Tests/Popolo.IO.Tests.csproj -c Release
          dotnet test tests/Popolo.Webpro.Tests/Popolo.Webpro.Tests.csproj -c Release

      - name: Pack
        run: |
          dotnet pack src/Popolo.Core/Popolo.Core.csproj -c Release -o packages
          dotnet pack src/Popolo.IO/Popolo.IO.csproj -c Release -o packages
          dotnet pack src/Popolo.Webpro/Popolo.Webpro.csproj -c Release -o packages

      # OIDC トークンを一時 API キーに交換する（Trusted Publishing の本体）
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: etogashi

      - name: Push to nuget.org
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # nuget 公開成功後に GitHub Release を発行する（タグ push 時のみ）
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 直前のタグ（現タグの祖先）以降のコミットをリリースノートにする
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..${GITHUB_REF_NAME}"; else RANGE="${GITHUB_REF_NAME}"; fi
          {
            echo "### 変更点"
            echo ""
            git log $RANGE --no-merges --pretty=format:'- %s'
            echo ""
            if [ -n "$PREV" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
